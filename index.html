<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><title>Español 0.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#111827}.wrap{max-width:700px;margin:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.version{font-size:12px;color:#9ca3af}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.stat{background:white;border-radius:14px;padding:9px 4px;text-align:center;box-shadow:0 2px 10px #0001}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#6b7280}.progress{height:10px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#22c55e;width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.esrow{display:grid;grid-template-columns:1fr 42px;gap:6px}.word,.audio{border:2px solid #d1d5db;background:white;border-radius:14px;font-size:18px;font-weight:650;min-height:58px;box-shadow:0 2px 8px #0000000b}.word{padding:13px 8px}.audio{font-size:19px;padding:0}.word.selected{border-color:#3b82f6;background:#eff6ff}.word.good{border-color:#16a34a;background:#dcfce7}.word.bad{border-color:#dc2626;background:#fee2e2}.done{visibility:hidden}.status{text-align:center;min-height:30px;font-weight:700;margin:12px}.bottom{background:white;border-radius:18px;padding:14px;margin-top:16px;box-shadow:0 2px 10px #0001}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;background:#111827;color:white}.small{text-align:center;color:#6b7280;font-size:12px;line-height:1.35;margin-top:10px}h1{font-size:28px;margin:8px 0 0}h2{font-size:15px;color:#6b7280;margin:4px 0}@media(max-width:390px){.wrap{padding:12px}.stats{gap:4px}.stat b{font-size:16px}.word{font-size:16px}.audio{font-size:17px}.grid{gap:8px}.esrow{grid-template-columns:1fr 38px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>🇪🇸 Español</h1><h2>A1 • inteligentne powtórki <span class="version">v0.2</span></h2></div></div><div class="stats"><div class="stat"><b id="newN">0</b><span>NOWE</span></div><div class="stat"><b id="dueN">0</b><span>POWTÓRKI</span></div><div class="stat"><b id="learnN">0</b><span>UCZĘ SIĘ</span></div><div class="stat"><b id="masterN">0</b><span>UTRWALONE</span></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Połącz słowo z tłumaczeniem</div><div class="grid"><div id="es" class="col"></div><div id="pl" class="col"></div></div><div class="bottom"><button class="btn" id="next">Następna runda</button><div class="small">Najpierw wracają zaległe i trudne słowa. 🔊 tylko odtwarza wymowę i nie zaznacza odpowiedzi. Dźwięk korzysta z aktualnego wyjścia audio iPhone’a.</div></div></div><script>
const RAW=`hola|cześć\ngracias|dziękuję\nadiós|do widzenia\npor favor|proszę\nsí|tak\nno|nie\nbien|dobrze\nmal|źle\nhombre|mężczyzna\nmujer|kobieta\nniño|chłopiec\nniña|dziewczynka\namigo|przyjaciel\namiga|przyjaciółka\nfamilia|rodzina\nmadre|matka\npadre|ojciec\nhermano|brat\nhermana|siostra\nhijo|syn\nhija|córka\ncasa|dom\npuerta|drzwi\nventana|okno\nmesa|stół\nsilla|krzesło\ncama|łóżko\ncocina|kuchnia\nbaño|łazienka\nhabitación|pokój\ncalle|ulica\nciudad|miasto\npueblo|miasteczko\npaís|kraj\nescuela|szkoła\ntrabajo|praca\noficina|biuro\ntienda|sklep\nrestaurante|restauracja\nhotel|hotel\nhospital|szpital\naeropuerto|lotnisko\nestación|stacja\ncoche|samochód\nautobús|autobus\ntren|pociąg\navión|samolot\nbicicleta|rower\ncamino|droga\nagua|woda\ncafé|kawa\nté|herbata\nleche|mleko\npan|chleb\nqueso|ser\ncarne|mięso\npescado|ryba\npollo|kurczak\nhuevo|jajko\narroz|ryż\npatata|ziemniak\nfruta|owoc\nmanzana|jabłko\nnaranja|pomarańcza\nverdura|warzywo\nsal|sól\nazúcar|cukier\ndesayuno|śniadanie\ncomida|jedzenie\ncena|kolacja\ncomer|jeść\nbeber|pić\ncocinar|gotować\ncomprar|kupować\npagar|płacić\nir|iść\nvenir|przychodzić\nver|widzieć\nmirar|patrzeć\nhablar|mówić\nescuchar|słuchać\nleer|czytać\nescribir|pisać\naprender|uczyć się\nentender|rozumieć\nsaber|wiedzieć\nconocer|znać\nquerer|chcieć\nnecesitar|potrzebować\ntener|mieć\nhacer|robić\nser|być\nestar|być / znajdować się\nvivir|mieszkać\ndormir|spać\ntrabajar|pracować\njugar|grać\nabrir|otwierać\ncerrar|zamykać\nempezar|zaczynać\nterminar|kończyć\ndía|dzień\nnoche|noc\nmañana|rano / jutro\ntarde|popołudnie\nhoy|dzisiaj\nayer|wczoraj\nsemana|tydzień\nmes|miesiąc\naño|rok\nhora|godzina\nminuto|minuta\ntiempo|czas / pogoda\nuno|jeden\ndos|dwa\ntres|trzy\ncuatro|cztery\ncinco|pięć\nseis|sześć\nsiete|siedem\nocho|osiem\nnueve|dziewięć\ndiez|dziesięć\ngrande|duży\npequeño|mały\nbueno|dobry\nmalo|zły\nnuevo|nowy\nviejo|stary\nbonito|ładny\nfeo|brzydki\nrápido|szybki\nlento|wolny\nfácil|łatwy\ndifícil|trudny\ncaliente|gorący\nfrío|zimny\nfeliz|szczęśliwy\ntriste|smutny\ncansado|zmęczony\nenfermo|chory\naquí|tutaj\nallí|tam\ncerca|blisko\nlejos|daleko\ndentro|wewnątrz\nfuera|na zewnątrz\narriba|na górze\nabajo|na dole\nizquierda|lewo\nderecha|prawo\nqué|co\nquién|kto\ndónde|gdzie\ncuándo|kiedy\ncómo|jak\npor qué|dlaczego\ncuánto|ile\ny|i\no|lub\npero|ale\nporque|ponieważ\ncon|z\nsin|bez\npara|dla / żeby\nde|z / od\nen|w / na\nmi|mój\ntu|twój\nsu|jego / jej\nnombre|imię\nnúmero|numer\ndinero|pieniądze\nprecio|cena\nteléfono|telefon\nlibro|książka\npalabra|słowo\npregunta|pytanie\nrespuesta|odpowiedź\nproblema|problem\nayuda|pomoc\nmédico|lekarz\npolicía|policja\nmano|dłoń\ncabeza|głowa\nojo|oko\nboca|usta\npie|stopa\nropa|ubranie\ncamisa|koszula\npantalón|spodnie\nzapato|but\nsol|słońce\nlluvia|deszcz\nmar|morze\nmontaña|góra\nperro|pies\ngato|kot`;
const WORDS=RAW.split('\n').map((x,i)=>{let [es,pl]=x.split('|');return {id:i,es,pl}});const UNLOCK_BATCH=10,ROUND=5,DAY=86400000;let stats=JSON.parse(localStorage.getItem('esStatsV2')||'{}');let meta=JSON.parse(localStorage.getItem('esMetaV2')||'{"unlocked":10}');meta.unlocked=Math.max(10,Math.min(WORDS.length,meta.unlocked||10));let left=null,right=null,done=0,round=[];
const now=()=>Date.now(),shuffle=a=>[...a].sort(()=>Math.random()-.5),S=w=>stats[w.id]||{stage:0,right:0,wrong:0,streak:0,due:0,last:0};function save(){localStorage.setItem('esStatsV2',JSON.stringify(stats));localStorage.setItem('esMetaV2',JSON.stringify(meta))}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.82;speechSynthesis.speak(u)}function priority(w){let s=S(w);if(s.due&&s.due<=now())return 100+s.wrong*8-s.streak*2;if(s.stage===0)return 60;if(s.stage<4)return 40+s.wrong*6-s.streak;return 5+Math.random()*10}function pick(){let pool=WORDS.slice(0,meta.unlocked);return pool.map(w=>[w,priority(w)+Math.random()*20]).sort((a,b)=>b[1]-a[1]).slice(0,ROUND).map(x=>x[0])}function dueDelay(s){if(s.stage<=1)return 10*60*1000;if(s.stage===2)return DAY;if(s.stage===3)return 4*DAY;if(s.stage===4)return 14*DAY;return 30*DAY}function updateStats(){let unlocked=WORDS.slice(0,meta.unlocked),n=0,d=0,l=0,m=0;unlocked.forEach(w=>{let s=S(w);if(!stats[w.id])n++;else if(s.due&&s.due<=now())d++;if(stats[w.id]&&s.stage>0&&s.stage<4)l++;if(stats[w.id]&&s.stage>=4)m++});newN.textContent=n;dueN.textContent=d;learnN.textContent=l;masterN.textContent=m}function render(){round=pick();done=0;left=right=null;bar.style.width='0%';status.textContent='Połącz słowo z tłumaczeniem';es.innerHTML='';pl.innerHTML='';round.forEach(w=>{let row=document.createElement('div');row.className='esrow';let e=document.createElement('button');e.className='word';e.dataset.id=w.id;e.dataset.side='es';e.textContent=w.es;e.onclick=()=>select(e);let a=document.createElement('button');a.className='audio';a.textContent='🔊';a.setAttribute('aria-label','Odtwórz '+w.es);a.onclick=ev=>{ev.stopPropagation();speak(w.es)};row.append(e,a);es.append(row)});shuffle(round).forEach(w=>{let e=document.createElement('button');e.className='word';e.dataset.id=w.id;e.dataset.side='pl';e.textContent=w.pl;e.onclick=()=>select(e);pl.append(e)});updateStats()}function select(el){if(el.classList.contains('done'))return;if(el.dataset.side==='es'){document.querySelectorAll('#es .selected').forEach(x=>x.classList.remove('selected'));left=el;speak(WORDS[+el.dataset.id].es)}else{document.querySelectorAll('#pl .selected').forEach(x=>x.classList.remove('selected'));right=el}el.classList.add('selected');if(left&&right)check()}function check(){let ok=left.dataset.id===right.dataset.id,key=+left.dataset.id,w=WORDS[key],s=S(w);if(ok){s.right++;s.streak++;s.stage=Math.min(5,s.stage+1);s.last=now();s.due=now()+dueDelay(s);stats[key]=s;left.classList.remove('selected');right.classList.remove('selected');left.classList.add('good');right.classList.add('good');status.textContent='✓ Dobrze';let a=left,b=right;setTimeout(()=>{a.classList.add('done');b.classList.add('done');let row=a.closest('.esrow');if(row)row.querySelector('.audio').classList.add('done');a.classList.remove('good');b.classList.remove('good');left=right=null;done++;bar.style.width=(done/ROUND*100)+'%';if(done===ROUND){status.textContent='🎉 Runda ukończona';maybeUnlock()}},420)}else{s.wrong++;s.streak=0;s.stage=Math.max(0,s.stage-1);s.last=now();s.due=now()+2*60*1000;stats[key]=s;left.classList.add('bad');right.classList.add('bad');status.textContent='✕ To słowo wróci szybciej';let a=left,b=right;setTimeout(()=>{a.classList.remove('bad','selected');b.classList.remove('bad','selected');left=right=null},550)}save();updateStats()}function maybeUnlock(){let unlocked=WORDS.slice(0,meta.unlocked),introduced=unlocked.filter(w=>stats[w.id]).length,learning=unlocked.filter(w=>stats[w.id]&&S(w).stage<3).length;if(introduced>=Math.min(meta.unlocked,10)&&learning<=6&&meta.unlocked<WORDS.length){meta.unlocked=Math.min(WORDS.length,meta.unlocked+UNLOCK_BATCH);save();updateStats()}}next.onclick=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
